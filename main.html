<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
//Your code goes here 
	const container = document.querySelector(".items");
const cubes = document.querySelectorAll(".item");

const cubeSize = 80;
const gap = 20;
const columns = 5;

let selectedCube = null;
let offsetX = 0;
let offsetY = 0;


// -----------------------------------
// Create initial grid
// -----------------------------------

cubes.forEach((cube, index) => {

  const row = Math.floor(index / columns);
  const column = index % columns;

  cube.style.position = "absolute";
  cube.style.width = `${cubeSize}px`;
  cube.style.height = `${cubeSize}px`;

  cube.style.left =
    `${column * (cubeSize + gap) + 20}px`;

  cube.style.top =
    `${row * (cubeSize + gap) + 20}px`;

});


// -----------------------------------
// Mouse down
// -----------------------------------

cubes.forEach((cube) => {

  cube.addEventListener("mousedown", (event) => {

    selectedCube = cube;

    const cubeRect = cube.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();

    // Mouse position inside the cube
    offsetX = event.clientX - cubeRect.left;
    offsetY = event.clientY - cubeRect.top;

    cube.style.zIndex = "1000";

    event.preventDefault();

  });

});


// -----------------------------------
// Mouse move
// -----------------------------------

document.addEventListener("mousemove", (event) => {

  if (selectedCube === null) {
    return;
  }

  const containerRect = container.getBoundingClientRect();
  const cubeRect = selectedCube.getBoundingClientRect();

  // Container border size
  const borderLeft = container.clientLeft;
  const borderTop = container.clientTop;

  // Container's usable width and height
  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;

  // Cube dimensions
  const cubeWidth = cubeRect.width;
  const cubeHeight = cubeRect.height;


  // -----------------------------------
  // Calculate mouse position
  // -----------------------------------

  let left =
    event.clientX -
    containerRect.left -
    borderLeft -
    offsetX;

  let top =
    event.clientY -
    containerRect.top -
    borderTop -
    offsetY;


  // -----------------------------------
  // Calculate boundaries
  // -----------------------------------

  const minLeft = 0;
  const minTop = 0;

  const maxLeft = containerWidth - cubeWidth;
  const maxTop = containerHeight - cubeHeight;


  // -----------------------------------
  // Keep cube completely inside
  // -----------------------------------

  left = Math.max(minLeft, Math.min(left, maxLeft));

  top = Math.max(minTop, Math.min(top, maxTop));


  // -----------------------------------
  // Move cube
  // -----------------------------------

  selectedCube.style.left = `${left}px`;
  selectedCube.style.top = `${top}px`;

});


// -----------------------------------
// Mouse up
// -----------------------------------

document.addEventListener("mouseup", () => {

  if (selectedCube !== null) {
    selectedCube.style.zIndex = "";
  }

  selectedCube = null;

});
</script>

  </body>
</html>
