<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>

const container = document.querySelector(".items");
const cubes = document.querySelectorAll(".item");

const cubeSize = 80;
const gap = 20;
const columns = 5;

let selectedCube = null;
let offsetX = 0;
let offsetY = 0;

// Initial grid setup
cubes.forEach((cube, index) => {
  const row = Math.floor(index / columns);
  const column = index % columns;

  cube.style.position = "absolute";
  cube.style.width = `${cubeSize}px`;
  cube.style.height = `${cubeSize}px`;

  cube.style.left = `${column * (cubeSize + gap) + 20}px`;
  cube.style.top = `${row * (cubeSize + gap) + 20}px`;
});

// Start dragging
cubes.forEach((cube) => {
  cube.addEventListener("pointerdown", (event) => {
    selectedCube = cube;

    const rect = cube.getBoundingClientRect();

    offsetX = event.clientX - rect.left;
    offsetY = event.clientY - rect.top;

    cube.style.zIndex = "1000";
    cube.setPointerCapture(event.pointerId);

    event.preventDefault();
  });

  cube.addEventListener("pointermove", (event) => {
    if (selectedCube !== cube) return;

    const containerRect = container.getBoundingClientRect();

    const leftEdge = container.clientLeft;
    const topEdge = container.clientTop;

    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;

    const cubeWidth = cube.offsetWidth;
    const cubeHeight = cube.offsetHeight;

    // Calculate position inside the container
    let left =
      event.clientX - containerRect.left - leftEdge
      + container.scrollLeft - offsetX;

    let top =
      event.clientY - containerRect.top - topEdge
      + container.scrollTop - offsetY;

    // Set maximum allowed positions
    const maxLeft = containerWidth - cubeWidth;
    const maxTop = containerHeight - cubeHeight;

    // Restrict movement within boundaries
    left = Math.max(0, Math.min(left, maxLeft));
    top = Math.max(0, Math.min(top, maxTop));

    // Apply new position
    cube.style.left = `${left}px`;
    cube.style.top = `${top}px`;
  });

  cube.addEventListener("pointerup", () => {
    if (selectedCube === cube) {
      cube.style.zIndex = "";
      selectedCube = null;
    }
  });

  cube.addEventListener("lostpointercapture", () => {
    if (selectedCube === cube) {
      cube.style.zIndex = "";
      selectedCube = null;
    }
  });
});


</script>

  </body>
</html>
