<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="items">
    <div class="item">01</div>
    <div class="item">02</div>
    <div class="item">03</div>
    <div class="item">04</div>
    <div class="item">05</div>
    <div class="item">06</div>
    <div class="item">07</div>
    <div class="item">08</div>
    <div class="item">09</div>
    <div class="item">10</div>
    <div class="item">11</div>
    <div class="item">12</div>
    <div class="item">13</div>
    <div class="item">14</div>
    <div class="item">15</div>
    <div class="item">16</div>
    <div class="item">17</div>
    <div class="item">18</div>
    <div class="item">19</div>
    <div class="item">20</div>
    <div class="item">21</div>
    <div class="item">22</div>
    <div class="item">23</div>
    <div class="item">24</div>
    <div class="item">25</div>
  </div>

  <script >
	 
const container = document.querySelector(".items");
const cubes = document.querySelectorAll(".item");

const cubeSize = 80;
const gap = 20;
const columns = 5;
const padding = 20;

let selectedCube = null;
let offsetX = 0;
let offsetY = 0;

// Initial grid setup
cubes.forEach((cube, index) => {
  const row = Math.floor(index / columns);
  const column = index % columns;

  const left = padding + column * (cubeSize + gap);
  const top = padding + row * (cubeSize + gap);

  cube.style.left = `${left}px`;
  cube.style.top = `${top}px`;

  cube.style.width = `${cubeSize}px`;
  cube.style.height = `${cubeSize}px`;
});

// Start dragging
cubes.forEach((cube) => {
  cube.addEventListener("pointerdown", (event) => {
    selectedCube = cube;

    const rect = cube.getBoundingClientRect();

    offsetX = event.clientX - rect.left;
    offsetY = event.clientY - rect.top;

    cube.style.zIndex = "1000";
    container.classList.add("active");

    cube.setPointerCapture(event.pointerId);

    event.preventDefault();
  });

  // Move cube
  cube.addEventListener("pointermove", (event) => {
    if (selectedCube !== cube) return;

    const containerRect = container.getBoundingClientRect();

    const borderLeft = container.clientLeft;
    const borderTop = container.clientTop;

    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;

    const cubeWidth = cube.offsetWidth;
    const cubeHeight = cube.offsetHeight;

    let left =
      event.clientX -
      containerRect.left -
      borderLeft -
      offsetX;

    let top =
      event.clientY -
      containerRect.top -
      borderTop -
      offsetY;

    // Boundary constraints
    const maxLeft = containerWidth - cubeWidth;
    const maxTop = containerHeight - cubeHeight;

    left = Math.max(0, Math.min(left, maxLeft));
    top = Math.max(0, Math.min(top, maxTop));

    // Apply position
    cube.style.left = `${left}px`;
    cube.style.top = `${top}px`;
  });

  // Stop dragging
  function stopDragging() {
    if (selectedCube === cube) {
      selectedCube.style.zIndex = "";
      selectedCube = null;
      container.classList.remove("active");
    }
  }

  cube.addEventListener("pointerup", stopDragging);
  cube.addEventListener("pointercancel", stopDragging);
  cube.addEventListener("lostpointercapture", stopDragging);
});


  </script>
</body>
</html>
